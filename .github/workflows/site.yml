name: site

# Publishes the landing page (site/) to GitHub Pages. One-time setup in the repo:
# Settings → Pages → Source: GitHub Actions. For a custom domain, set it there too.
on:
  push:
    branches: [master]
    paths: [site/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs so "Re-run failed jobs" re-runs only the deploy.
  # Re-running a single combined job uploads a second github-pages artifact, and
  # deploy-pages then refuses to choose between them (actions/deploy-pages#338).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    # A just-uploaded artifact can be missing from the artifact list for seconds, and
    # sometimes about a minute (actions/deploy-pages#451): "No artifacts named github-pages".
    # The lookup fails before anything is deployed, so retrying with backoff is safe.
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.d1.outcome == 'failure'
        run: sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.d2.outcome == 'failure'
        run: sleep 60
      - id: d3
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
