# Desiide app release (REL-1, ADR-011). Push a tag `app-v<semver>`, e.g. app-v0.1.0-alpha.1:
# verify → build the app (desiide-ai built in) per platform → install and launch every asset →
# GitHub Release with SHA256SUMS. Tags with a pre-release suffix (-alpha, -beta) are pre-releases.
# Re-run for an existing tag with "Run workflow". PRs that touch the build or packaging run everything
# except publishing (a dry run, version 0.0.0-pr.<number>).
name: release-app

on:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - editor
      - scripts/build-editor.sh
      - scripts/package-app.sh
      - scripts/smoke-app.sh
      - scripts/lib/**
      - .github/workflows/release-app.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing app-v* tag to build and (re)publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-app-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Empty on pull_request: checkout then uses the PR's merge commit.
  TAG: ${{ inputs.tag || (github.event_name != 'pull_request' && github.ref_name || '') }}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "${PR_NUMBER}" ]]; then
            printf 'version=0.0.0-pr.%s\nprerelease=true\n' "${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          parsed="$( node scripts/release/tag.ts "${TAG}" )"
          grep -qx 'kind=app' <<< "${parsed}" || { echo "::error::${TAG} is not an app-v* tag"; exit 1; }
          echo "${parsed}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: tag
    if: github.event_name != 'pull_request' # verify.yml already runs on every PR
    uses: ./.github/workflows/verify.yml

  build:
    needs: [tag, verify]
    if: ${{ !cancelled() && needs.tag.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.verify.result) }}
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          # 22.04, not latest: the oldest glibc we can build on is the oldest one the app runs on.
          - target: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash # -o pipefail, so `| tee` keeps a failing exit code
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot dpkg-dev xvfb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: true
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # VSCodium's pinned Node: build-editor.sh would otherwise download it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: editor/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each step tees its output so a failure can be posted as an annotation (see the last step).
      - name: Build
        env:
          # Build dependencies (e.g. @vscode/ripgrep) download from GitHub; unauthenticated requests
          # from shared runners hit the rate limit (403). Read-only token, valid for this job only.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-editor.sh 2>&1 | tee "${RUNNER_TEMP}/build.log"
      - name: Package
        run: scripts/package-app.sh "${VERSION}" dist/app 2>&1 | tee "${RUNNER_TEMP}/package.log"
      - name: Install and launch every asset
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            xvfb-run -a scripts/smoke-app.sh "${VERSION}" dist/app 2>&1 | tee "${RUNNER_TEMP}/smoke.log"
          else
            scripts/smoke-app.sh "${VERSION}" dist/app 2>&1 | tee "${RUNNER_TEMP}/smoke.log"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.target }}
          path: dist/app/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0 # already compressed
      - name: Post the failure as an annotation
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for step in build package smoke; do
            if [[ -f "${RUNNER_TEMP}/${step}.log" ]]; then last="${step}"; fi
          done
          [[ -n "${last:-}" ]] && scripts/ci/annotate-failure.sh "${TARGET}: ${last} failed" "${RUNNER_TEMP}/${last}.log"

  release:
    needs: [tag, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      PRERELEASE: ${{ needs.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # release notes need the previous tag and the commits since
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-*
          merge-multiple: true
          path: assets
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: node scripts/release/notes.ts "${TAG}" > release-notes.md
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "${PRERELEASE}" == "true" ]] && prerelease=(--prerelease)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" assets/* --clobber
            gh release edit "${TAG}" --title "Desiide ${VERSION}" --notes-file release-notes.md "${prerelease[@]}"
          else
            gh release create "${TAG}" assets/* --verify-tag --title "Desiide ${VERSION}" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi
          echo "### [Desiide ${VERSION}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "${GITHUB_STEP_SUMMARY}"
