# Standalone desiide-ai release (REL-1, Beta). Push a tag `ext-v<semver>` whose major.minor.patch is
# extensions/desiide-ai/package.json's version: verify → package the .vsix → publish to the VS Code
# Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT) → GitHub Release with the .vsix.
# A pre-release suffix (ext-v0.2.0-beta) publishes 0.2.0 on both registries' pre-release channel.
# A registry whose secret is missing is skipped (dry run), so the flow can be tested before Beta.
name: release-extension

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing ext-v* tag to package and (re)publish
        required: true

permissions:
  contents: read

concurrency:
  group: release-extension-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # release notes need the previous tag and the commits since
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: tag
        name: Check the tag against package.json
        run: |
          parsed="$( node scripts/release/tag.ts "${TAG}" --package extensions/desiide-ai/package.json )"
          grep -qx 'kind=ext' <<< "${parsed}" || { echo "::error::${TAG} is not an ext-v* tag"; exit 1; }
          echo "${parsed}" >> "${GITHUB_OUTPUT}"
          echo "core=$( jq -r .version extensions/desiide-ai/package.json )" >> "${GITHUB_OUTPUT}"

      - name: Package
        env:
          CORE: ${{ steps.tag.outputs.core }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        working-directory: extensions/desiide-ai
        run: |
          pre=()
          [[ "${PRERELEASE}" == "true" ]] && pre=(--pre-release)
          node scripts/build.mjs --production
          pnpm exec vsce package --no-dependencies "${pre[@]}" --out "../../desiide-ai-${CORE}.vsix"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          CORE: ${{ steps.tag.outputs.core }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "- VS Code Marketplace: skipped (no VSCE_PAT secret)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          pre=()
          [[ "${PRERELEASE}" == "true" ]] && pre=(--pre-release)
          pnpm -F desiide-ai exec vsce publish "${pre[@]}" --packagePath "${PWD}/desiide-ai-${CORE}.vsix"
          echo "- VS Code Marketplace: published ${CORE}${pre[*]:+ (pre-release)}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          CORE: ${{ steps.tag.outputs.core }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [[ -z "${OVSX_PAT}" ]]; then
            echo "- Open VSX: skipped (no OVSX_PAT secret)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          pre=()
          [[ "${PRERELEASE}" == "true" ]] && pre=(--pre-release)
          # Exact version, run only here: as a devDependency it would pull a second vsce + keytar.
          npx --yes ovsx@1.2.0 publish "desiide-ai-${CORE}.vsix" "${pre[@]}"
          echo "- Open VSX: published ${CORE}${pre[*]:+ (pre-release)}" >> "${GITHUB_STEP_SUMMARY}"

      - name: GitHub Release with the .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ steps.tag.outputs.core }}
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          node scripts/release/notes.ts "${TAG}" > release-notes.md
          prerelease=()
          [[ "${PRERELEASE}" == "true" ]] && prerelease=(--prerelease)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "desiide-ai-${CORE}.vsix" --clobber
            gh release edit "${TAG}" --title "Desiide AI ${VERSION}" --notes-file release-notes.md "${prerelease[@]}"
          else
            gh release create "${TAG}" "desiide-ai-${CORE}.vsix" --verify-tag --title "Desiide AI ${VERSION}" \
              --notes-file release-notes.md "${prerelease[@]}"
          fi
          echo "- GitHub Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "${GITHUB_STEP_SUMMARY}"
